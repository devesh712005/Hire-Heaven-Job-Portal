steps:
  - name: Checkout Code
    uses: actions/checkout@v3

  - name: Deploy via SSH (Safe Deploy)
    uses: appleboy/ssh-action@v1.0.3
    with:
      host: ${{ secrets.SSH_HOST }}
      username: ubuntu
      key: ${{ secrets.SSH_KEY }}
      script: |
        set -e

        echo "🚀 Starting Deployment..."

        cd /home/ubuntu

        if [ ! -d "Hire-Heaven-Job-Portal" ]; then
          git clone https://github.com/devesh712005/Hire-Heaven-Job-Portal.git
        fi

        cd Hire-Heaven-Job-Portal

        echo "📥 Pulling latest code..."
        git pull origin main

        echo "🛑 Stopping old containers..."
        docker-compose down

        echo "🔨 Building (with cache for speed)..."
        docker-compose build

        echo "🚀 Starting services..."
        docker-compose up -d

        echo "🧹 Cleaning unused images (SAFE)..."
        docker image prune -f

        echo "✅ Deployment Complete!"
        docker ps